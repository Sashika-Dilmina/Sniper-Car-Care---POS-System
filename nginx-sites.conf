# =============================================================
# Sniper Car Care - Ultra High-Performance Nginx Configuration
# =============================================================
# This file configures 3 frontend sites on subdomains:
#   snipercarcare.com & www.snipercarcare.com → POS Dashboard
#   saloon.snipercarcare.com                 → Customer Website - Saloon
#   4x4.snipercarcare.com                    → Customer Website - 4x4
# Backend API runs on Port 5000 (Node.js) and is proxied under /api/
# =============================================================

# --- Site 1: POS Dashboard (Admin Panel) ---
server {
    listen 80;
    server_name snipercarcare.com www.snipercarcare.com;

    root /var/www/pos-dashboard;
    index index.html;

    client_max_body_size 50M;
    keepalive_timeout 65;

    # Gzip compression for superfast loading
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Backend API (Node.js on port 5000)
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # Proxy uploads from the backend
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:5000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # SPA routing - all routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets for 30 days
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|avif|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}

