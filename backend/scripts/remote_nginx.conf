# =============================================================
# Sniper Car Care - Nginx Configuration for Hostinger VPS
# =============================================================
# This file configures 3 frontend sites on subdomains:
#   snipercarcare.com & www.snipercarcare.com → POS Dashboard
#   saloon.snipercarcare.com                 → Customer Website - Saloon
#   4x4.snipercarcare.com                    → Customer Website - 4x4
# Backend API runs on Port 5000 (Node.js) and is proxied under /api/
# =============================================================

# --- Site 1: POS Dashboard (Admin Panel) ---
server {
    server_name snipercarcare.com www.snipercarcare.com;

    root /var/www/pos-dashboard;
    index index.html;

    client_max_body_size 50M;

    # Backend API (Node.js on port 5000)
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy uploads from the backend
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA routing - all routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|avif|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/snipercarcare.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/snipercarcare.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

