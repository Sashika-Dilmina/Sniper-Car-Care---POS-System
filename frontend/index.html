<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1e40af" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script type="text/javascript">
      (function() {
        // Force Arabic default migration for existing users
        if (!localStorage.getItem('lang_migrated_to_ar_v2')) {
          localStorage.setItem('user_lang', 'ar');
          localStorage.setItem('lang_migrated_to_ar_v2', 'true');
        }
        var userLang = localStorage.getItem('user_lang');
        if (!userLang) {
          userLang = 'ar';
          localStorage.setItem('user_lang', 'ar');
        }
        var cookieVal = userLang === 'ar' ? '/en/ar' : '/en/en';
        var setCookie = function(name, value) {
          var expires = "; expires=" + new Date(Date.now() + 365 * 24 * 60 * 60 * 1000).toUTCString();
          document.cookie = name + "=" + value + expires + "; path=/;";
          var hostParts = window.location.hostname.split('.');
          if (hostParts.length > 1) {
            var domain = hostParts.slice(-2).join('.');
            document.cookie = name + "=" + value + expires + "; path=/; domain=." + domain + ";";
          }
        };
        setCookie('googtrans', cookieVal);
        if (userLang === 'ar') {
          document.documentElement.dir = 'rtl';
          document.documentElement.lang = 'ar';
        } else {
          document.documentElement.dir = 'ltr';
          document.documentElement.lang = 'en';
        }
      })();
    </script>
    <title>Sniper Car Care - ANPR POS System</title>
    <style>
      iframe.skiptranslate,
      .skiptranslate,
      iframe[class*="goog"],
      iframe[id*="goog"],
      .goog-te-banner-frame,
      .goog-te-banner,
      .goog-te-gadget-simple, 
      .goog-te-balloon-frame,
      iframe.goog-te-menu-frame,
      .goog-te-menu-value,
      #goog-gt-tt,
      .goog-te-spinner-pos,
      #google_translate_element {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        height: 0px !important;
        width: 0px !important;
      }
      html, body {
        top: 0px !important;
        position: static !important;
        margin-top: 0px !important;
        padding-top: 0px !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="google_translate_element" style="display:none"></div>
    <script type="text/javascript">
      window.googleTranslateElementInit = function() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'en,ar',
          autoDisplay: false
        }, 'google_translate_element');
      };
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
